[package]
name = "tui-disk"
version = "0.1.0"
edition = "2024"
description = "A visual disk usage explorer for Linux"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
