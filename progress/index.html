<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disk usage TUI — live judging</title><style>
:root{color-scheme:dark;font:15px/1.5 ui-sans-serif,system-ui;background:#10161e;color:#dce7f2}*{box-sizing:border-box}body{max-width:1520px;margin:auto;padding:28px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 12px}.sub{color:#94a7ba}header{display:flex;justify-content:space-between;gap:24px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:28px}.tile,.round{background:#18222f;border:1px solid #2a3b4e;border-radius:10px;padding:16px}.tile b{display:block;text-transform:capitalize}.count{font-size:24px;font-variant-numeric:tabular-nums}.badge{display:inline-block;font-size:12px;border-radius:4px;background:#46313c;color:#fbb2c5;padding:2px 7px}.won{background:#184938;color:#a0efc5}.round{margin-bottom:20px}.round header{margin-bottom:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair img{width:100%;display:block;background:#111}.caption{font-size:13px;color:#a8bed0;margin:5px 0}.evidence{white-space:pre-wrap;max-width:1100px}.event{border-left:2px solid #466781;padding-left:10px;color:#a9bdcc;margin:10px 0}.timer{font:20px ui-monospace,monospace;white-space:nowrap}a{color:#80ccff}@media(max-width:800px){body{padding:14px}.pair{grid-template-columns:1fr}header{display:block}}
</style></head><body><header><div><h1>What ate my SSD?</h1><div id="phase" class="sub">Loading judging state…</div></div><div><div class="sub">Time until hard freeze</div><div id="timer" class="timer"></div></div></header><div id="pieces" class="grid"></div><section id="rounds"></section><h2>Referee events</h2><div id="events"></div><p class="sub">Current acceptance: one fresh critic win, after first-round fairness audit. A pending or unverified piece is lost at the deadline. Source edits cancel wins. <a href="/judging/PROTOCOL.md">Judging protocol</a> · <a href="/progress/state.json">Raw state</a></p><script>
const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let state;function clock(){if(!state)return;let n=Math.max(0,Date.parse(state.deadline)-Date.now());el('timer').textContent=state.completed?'ALL PIECES WON':state.frozen?'FROZEN':`${String(Math.floor(n/3600000)).padStart(2,'0')}:${String(Math.floor(n/60000)%60).padStart(2,'0')}:${String(Math.floor(n/1000)%60).padStart(2,'0')}`;}async function update(){try{state=await(await fetch('/progress/state.json?'+Date.now())).json();el('phase').textContent=state.phase;el('pieces').innerHTML=Object.entries(state.pieces).map(([k,p])=>`<div class="tile"><b>${esc(k)}</b><div class="count">${p.valid_wins} / ${p.required_wins}</div><span class="badge ${p.status==='won'?'won':''}">${esc(p.status)}</span>${p.note?`<div class="caption">${esc(p.note)}</div>`:''}</div>`).join('');el('rounds').innerHTML=[...state.rounds].reverse().map(r=>`<article class="round"><header><h2>${esc(r.piece)} · ${esc(r.id)}</h2><span class="badge ${r.counts?'won':''}">${esc(r.counts?'counted win':r.invalidated_reason?'invalidated':r.verdict?(r.result?'uncounted verdict':'awaiting referee'):'awaiting verdict')}</span></header><div class="pair">${['A','B'].map(l=>`<div><a href="${esc(r.packet)}/${l}.png" target="_blank"><img loading="lazy" src="${esc(r.packet)}/${l}.png"></a><div class="caption">${l}${r.identities?' · '+esc(r.identities[l]):''}</div></div>`).join('')}</div>${r.frames?`<p class="caption">Full-resolution states: ${r.frames.map((name,i)=>`${esc(name)} <a href="${esc(r.packet)}/A-${i+1}.png" target="_blank">A${i+1}</a> / <a href="${esc(r.packet)}/B-${i+1}.png" target="_blank">B${i+1}</a>`).join(' · ')}</p>`:''}${r.verdict?`<p><b>Critic chose ${esc(r.verdict.choice)}.</b> ${esc(r.critic||'Fresh critic')}</p><div class="evidence">${esc(r.verdict.evidence)}</div><p><b>Largest reason the loser lost:</b> ${esc(r.verdict.loser_reason)}</p>`:''}${r.invalidated_reason?`<p class="sub">Invalidation: ${esc(r.invalidated_reason)}</p>`:''}${r.audit?`<p class="sub">Referee audit: ${esc(r.audit)}</p>`:''}</article>`).join('');el('events').innerHTML=[...state.events].reverse().map(e=>`<div class="event"><span class="caption">${esc(e.time)}</span> · ${esc(e.message)}</div>`).join('');clock();}catch(e){el('phase').textContent='Waiting for state: '+e;}}update();setInterval(update,3000);setInterval(clock,1000);
</script></body></html>
