<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disk usage TUI — current work and baseline judging</title><style>
:root{color-scheme:dark;font:15px/1.5 ui-sans-serif,system-ui;background:#10161e;color:#dce7f2}*{box-sizing:border-box}body{max-width:1520px;margin:auto;padding:28px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 12px}.sub{color:#94a7ba}header{display:flex;justify-content:space-between;gap:24px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:28px}.tile,.round,.scope{background:#18222f;border:1px solid #2a3b4e;border-radius:10px;padding:16px}.scope{margin-bottom:20px}.tile b{display:block;text-transform:capitalize}.count{font-size:24px;font-variant-numeric:tabular-nums}.badge{display:inline-block;font-size:12px;border-radius:4px;background:#46313c;color:#fbb2c5;padding:2px 7px}.won{background:#184938;color:#a0efc5}.pending{background:#263e55;color:#b7d9f0}.round{margin-bottom:20px}.round header{margin-bottom:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair img{width:100%;display:block;background:#111}.caption{font-size:13px;color:#a8bed0;margin:5px 0}.evidence{white-space:pre-wrap;max-width:1100px}.event{border-left:2px solid #466781;padding-left:10px;color:#a9bdcc;margin:10px 0}.timer{font:20px ui-monospace,monospace;white-space:nowrap}a{color:#80ccff}@media(max-width:800px){body{padding:14px}.pair{grid-template-columns:1fr}header{display:block}}
</style></head><body>
<header><div><h1>What ate my SSD?</h1><div id="phase" class="sub">Loading progress…</div></div><div><div id="clock-label" class="sub"></div><div id="timer" class="timer"></div></div></header>
<section id="scope"></section><section id="collector-gallery"></section><h2 id="pieces-heading"></h2><div id="pieces" class="grid"></div><h2 id="rounds-heading"></h2><p id="rounds-context" class="sub"></p><section id="rounds"></section><h2>Evidence history</h2><div id="events"></div><p id="protocol-context" class="sub"></p>
<script>
const el=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const human=x=>String(x??'').replaceAll('_',' ');
let state;
function clock(){
  if(!state)return;
  if(state.scope==='design-gauntlet'&&state.frozen){el('clock-label').textContent='Stopped by user';el('timer').textContent=`${state.final_score.won} / ${state.final_score.total} WON`;return;}
  if(state.competition_active===false){
    el('clock-label').textContent='Current follow-up';
    el('timer').textContent=human(state.follow_up?.status||'in progress').toUpperCase();
    return;
  }
  el('clock-label').textContent='Design deadline · 02:45:54 UTC';
  const n=Math.max(0,Date.parse(state.deadline)-Date.now());
  el('timer').textContent=state.completed?'ALL PIECES WON':state.frozen?'FROZEN':`${String(Math.floor(n/3600000)).padStart(2,'0')}:${String(Math.floor(n/60000)%60).padStart(2,'0')}:${String(Math.floor(n/1000)%60).padStart(2,'0')}`;
}
function roundHtml(r){
  const historical=r.scope?.startsWith('baseline-');
  const base=historical?'baseline ':'';
  const status=r.counts?'win':r.invalidated_reason?'invalidated':r.verdict?(r.result?'uncounted verdict':'awaiting referee'):'awaiting verdict';
  return `<article class="round"><header><h2>${esc(r.piece)} · ${esc(r.id)}</h2><span class="badge ${r.counts?'won':''}">${esc(base+status)}</span></header>${historical?`<p class="caption">Historical evidence for ${esc(r.scope.replace('baseline-','commit '))}; does not count for the collector release.</p>`:''}<div class="pair">${['A','B'].map(l=>`<div><a href="${esc(r.packet)}/${l}.png" target="_blank"><img loading="lazy" src="${esc(r.packet)}/${l}.png"></a><div class="caption">${l}${r.identities?' · '+esc(r.identities[l]):''}</div></div>`).join('')}</div>${r.frames?`<p class="caption">Full-resolution states: ${r.frames.map((name,i)=>`${esc(name)} <a href="${esc(r.packet)}/A-${i+1}.png" target="_blank">A${i+1}</a> / <a href="${esc(r.packet)}/B-${i+1}.png" target="_blank">B${i+1}</a>`).join(' · ')}</p>`:''}${r.verdict?`<p><b>Critic chose ${esc(r.verdict.choice)}.</b> ${esc(r.critic||'Fresh critic')}</p><div class="evidence">${esc(r.verdict.evidence)}</div><p><b>Largest reason the loser lost:</b> ${esc(r.verdict.loser_reason)}</p>`:''}${r.invalidated_reason?`<p class="sub">Invalidation: ${esc(r.invalidated_reason)}</p>`:''}${r.audit?`<p class="sub">Referee audit: ${esc(r.audit)}</p>`:''}</article>`;
}
async function update(){
  try{
    state=await(await fetch('/progress/state.json?'+Date.now())).json();
    const followup=state.competition_active===false&&state.scope!=='design-gauntlet';
    el('phase').textContent=state.phase;
    el('scope').innerHTML=state.archives?`<div class="scope"><h2>Design judging · Astra build, Fable critique</h2><p>Six design pieces. One fresh critic win per piece after independent fairness audit. Every unfinished piece is lost at the deadline. Original build and collector results are archived separately; this round makes no performance claim.</p><p>${state.archives.map(a=>`<a href="${esc(a.path)}">${esc(a.title)}</a>`).join(' · ')}</p></div>`:state.baseline?`<div class="scope"><h2>${esc(state.follow_up.title)} — ${esc(human(state.follow_up.status))}</h2><p>${esc(state.follow_up.note)}</p><p>Current acceptance: <b>${esc(human(state.follow_up.acceptance))}</b>. No timed contest is active and no visual rejudging has been requested. <span id="acceptance-link">Functional acceptance evidence is pending.</span></p><p class="sub"><b>Archived baseline ${esc(state.baseline.commit)}:</b> ${state.baseline.product_pieces_won} of ${state.baseline.product_pieces_total} original pieces won; ${state.baseline.verdicts_retained} verdicts retained. These are historical results for release ${esc(state.baseline.release_sha256.slice(0,8))}. <a href="${esc(state.baseline.state)}">Exact archived state</a> · <a href="/judging/FOLLOW-UP.md">Follow-up evidence scope</a></p></div>`:'';
    const current=state.follow_up;
    el('collector-gallery').innerHTML=followup&&current?.screenshots?.length?`<section class="scope"><h2>Current collector — ${esc(current.tests.total_passed)} of ${esc(current.tests.total)} checks pass</h2><p>${Object.entries(current.tests).filter(([k,v])=>v&&typeof v==='object').map(([k,v])=>`<a href="/${esc(v.evidence)}">${esc(v.passed)} / ${esc(v.total)} ${esc(human(k))}</a>`).join(' · ')} · <a href="${esc(current.acceptance_evidence)}">Full acceptance record</a></p><p class="sub">Headless functional review of release ${esc(current.release_sha256.slice(0,8))}. These screenshots are not new blind visual verdicts; this release has not been benchmarked.</p><div class="pair">${current.screenshots.map(s=>`<div><a href="${esc(s.path)}" target="_blank"><img loading="lazy" src="${esc(s.path)}" alt="${esc(s.title)}"></a><p class="caption"><a href="${esc(s.path)}" target="_blank">${esc(s.title)} — full resolution</a></p></div>`).join('')}</div></section>`:'';
    el('pieces-heading').textContent=followup?'Current release: no inherited judging wins':'Judging pieces';
    el('pieces').innerHTML=Object.entries(state.pieces).filter(([k])=>!followup||k!=='calibration').map(([k,p])=>`<div class="tile"><b>${esc(k)}</b>${followup?'':`<div class="count">${p.valid_wins} / ${p.required_wins}</div>`}<span class="badge ${p.status==='won'?'won':followup?'pending':''}">${esc(human(p.status))}</span>${p.note?`<div class="caption">${esc(p.note)}</div>`:''}</div>`).join('');
    el('rounds-heading').textContent=state.baseline?'Historical judging — baseline '+state.baseline.commit:'Blind comparisons';
    el('rounds-context').textContent=state.baseline?'The side-by-sides and verdicts below belong to the completed baseline. They have not judged the collector feature.':'';
    el('rounds').innerHTML=[...state.rounds].reverse().map(roundHtml).join('');
    el('events').innerHTML=[...state.events].reverse().map(e=>`<div class="event"><span class="caption">${esc(e.time)}${e.scope?' · '+esc(human(e.scope)):''}</span> · ${esc(e.message)}</div>`).join('');
    el('protocol-context').innerHTML=followup?'The original timed judging is archived. Collector work uses functional acceptance and review; there is no new contest deadline. <a href="/judging/PROTOCOL.md">Historical baseline protocol</a> · <a href="/progress/state.json">Current state</a>':'One fresh critic win is required after fairness audit. Source edits cancel current wins. <a href="/judging/DESIGN-PROTOCOL.md">Design judging protocol</a> · <a href="/progress/state.json">Raw state</a>';
    clock();
    if(followup&&state.follow_up.acceptance_evidence){
      const path=state.follow_up.acceptance_evidence;
      try{const response=await fetch(path,{method:'HEAD',cache:'no-store'});if(response.ok&&el('acceptance-link'))el('acceptance-link').innerHTML=`<a href="${esc(path)}">Functional acceptance evidence</a>`;}catch{}
    }
  }catch(e){el('phase').textContent='Waiting for state: '+e;}
}
update();setInterval(update,3000);setInterval(clock,1000);
</script></body></html>
