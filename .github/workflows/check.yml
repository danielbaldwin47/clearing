name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: a floating stable turns clippy -D warnings red on a lint release. Bump together with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: gio, which the Trash acceptance checks move files with
        if: runner.os == 'Linux'
        run: command -v gio || (sudo apt-get update && sudo apt-get install -y libglib2.0-bin)
      - name: The gate's Commit tier (docs/agents/gate.md)
        if: runner.os == 'Linux'
        run: scripts/gate check
      - name: The commit was formatted before it was pushed
        if: runner.os == 'Linux'
        run: git diff --exit-code
      - if: runner.os == 'macOS'
        run: cargo test --locked
      - if: runner.os == 'macOS'
        run: cargo build --release --locked
      - name: Scan a disposable tree without a terminal
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          mkdir "$scan_dir/nested"
          printf 'test data' > "$scan_dir/nested/sample.txt"
          ./target/release/spacemap --scan --json "$scan_dir"
      - name: Verify native Trash and restoration on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/macos_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: spacemap-${{ runner.os }}-${{ runner.arch }}
          path: target/release/spacemap
