name: Check

# One run per commit: a branch is checked as its pull request, main as its push.
on:
  push:
    branches: [main]
  # A ticket's pull request into a spec branch starts no run: the spec's own pull request is its check.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to a pull request replaces the run of the commit before it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The check jobs run only for a commit that changes a path they read: READ and READ_BY_CI in
  # scripts/gate are the list. A commit that differs in none of them from a green commit (this
  # branch's green runs, or the commit of main it grew from) is covered, and this job is its whole run.
  changed:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      covered: ${{ steps.covered.outputs.covered }}
      # Written by `scripts/gate covered` itself: covered but for Cargo.toml's package metadata (METADATA there).
      package: ${{ steps.covered.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: covered
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          green=$(gh run list --workflow check.yml --branch "$BRANCH" --status success --limit 10 --json headSha --jq '.[].headSha')
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            grew_from=$(git merge-base origin/main HEAD)
          else
            grew_from=$BEFORE
          fi
          if scripts/gate covered $green $grew_from; then
            echo "covered=true" >> "$GITHUB_OUTPUT"
          fi

  # No check job reads the package metadata of Cargo.toml; packaging does, so it stands in for them.
  package:
    needs: changed
    if: needs.changed.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo publish --dry-run --locked

  check:
    needs: changed
    # !cancelled(): a dispatched run skips `changed`, and a `changed` that failed decides nothing; both still check.
    if: ${{ !cancelled() && needs.changed.outputs.covered != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # The slowest runner takes 1 on a warm cache and 3 from cold (#44); a hung acceptance session would otherwise hold its runner for 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned: a floating stable turns clippy -D warnings red on a lint release. Bump together with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      # Keyed on the runner, the toolchain above and Cargo.lock. A pull request restores and never saves, so a
      # branch cannot fill the repository's 10 GB; a miss or a failed restore compiles from cold and stays green.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: gio, which the Trash acceptance checks move files with
        if: runner.os == 'Linux'
        run: command -v gio || (sudo apt-get update && sudo apt-get install -y libglib2.0-bin)
      - name: The gate's Commit tier (docs/agents/gate.md)
        if: runner.os == 'Linux'
        run: scripts/gate check
      - name: The commit was formatted before it was pushed
        if: runner.os == 'Linux'
        run: git diff --exit-code
      - if: runner.os == 'macOS'
        run: cargo test --locked
      - if: runner.os == 'macOS'
        run: cargo build --release --locked
      - name: Scan a disposable tree without a terminal
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          mkdir "$scan_dir/nested"
          printf 'test data' > "$scan_dir/nested/sample.txt"
          ./target/release/clearing --scan --json "$scan_dir"
      - name: Verify native Trash and restoration on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/macos_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: clearing-${{ runner.os }}-${{ runner.arch }}
          path: target/release/clearing
