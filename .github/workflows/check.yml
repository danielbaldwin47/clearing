name: Check

# One run per commit: a branch is checked as its pull request, main as its push.
# No step reads Markdown (UNREAD_SUFFIXES in scripts/gate), so a change to nothing else starts no run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  # A ticket's pull request into a spec branch starts no run: the spec's own pull request is its check.
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A push to a pull request replaces the run of the commit before it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # paths-ignore reads a pull request's whole diff, so a Markdown-only commit on a code branch still
  # arrives here. It is checked already when it differs only in Markdown from the branch's last green commit.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      unread: ${{ steps.diff.outputs.unread }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for green in $(gh run list --workflow check.yml --branch "$BRANCH" --status success --limit 5 --json headSha --jq '.[].headSha'); do
            if names=$(git diff --name-only --no-renames "$green" HEAD) && ! grep -qv '\.md$' <<<"$names"; then
              echo "only Markdown changed since $green passed"
              echo "unread=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

  check:
    needs: changed
    # !cancelled(): a push to main skips `changed`, and a `changed` that failed decides nothing; both still check.
    if: ${{ !cancelled() && needs.changed.outputs.unread != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: a floating stable turns clippy -D warnings red on a lint release. Bump together with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: gio, which the Trash acceptance checks move files with
        if: runner.os == 'Linux'
        run: command -v gio || (sudo apt-get update && sudo apt-get install -y libglib2.0-bin)
      - name: The gate's Commit tier (docs/agents/gate.md)
        if: runner.os == 'Linux'
        run: scripts/gate check
      - name: The commit was formatted before it was pushed
        if: runner.os == 'Linux'
        run: git diff --exit-code
      - if: runner.os == 'macOS'
        run: cargo test --locked
      - if: runner.os == 'macOS'
        run: cargo build --release --locked
      - name: Scan a disposable tree without a terminal
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          mkdir "$scan_dir/nested"
          printf 'test data' > "$scan_dir/nested/sample.txt"
          ./target/release/clearing --scan --json "$scan_dir"
      - name: Verify native Trash and restoration on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/macos_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: clearing-${{ runner.os }}-${{ runner.arch }}
          path: target/release/clearing
