name: Put Back race

# Throwaway measurement for the wayfinder ticket "Measure the Put Back race on the macOS runner".
on:
  push:
    branches: [research/put-back-race]

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swiftc -O research/put-back-race/trashbatch.swift -o "$RUNNER_TEMP/trashbatch"
      - name: Measure
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ds_store
          "$RUNNER_TEMP/venv/bin/python" research/put-back-race/measure.py "$RUNNER_TEMP/trashbatch" | tee "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: put-back-race-${{ matrix.os }}
          path: ${{ runner.temp }}/result.json
